schema_version: 2

public_asset_policy:
  summary: >
    The public repository keeps only source assets used by the runtime,
    documentation, tests, or reproducible demos. Raw AI exploration exports and
    packaged moodboard ZIPs are local-only and ignored by git.
  keep_public:
    - jiajia/assets/paperclip/jiajia-refined.svg
    - jiajia/assets/costumes/
    - jiajia/assets/decorations/
    - jiajia/assets/vendor/
    - docs/media/
  keep_local_only:
    - raw ChatGPT concept PNGs
    - raw Gemini concept PNGs
    - generated exploration ZIP packages
    - full 36-pose concept sheets not used by runtime

base_character:
  path: jiajia/assets/paperclip/jiajia-refined.svg
  role: authoritative_character_shape
  source: project_specific_user_drawn_vector
  style:
    body_wire: "#AEAEAE"
    eye_white: "#ECECEC"
    pupil_and_brow: "#402A32"
  constraints:
    - flat_vector
    - no_mouth
    - no_hands_or_feet_on_base_body
    - no_gradients
    - no_texture
    - no_complex_shadow

runtime_layers:
  - id: body_wire
    role: main paperclip silhouette
  - id: left_eye_white
    role: left eye white
  - id: right_eye_white
    role: right eye white
  - id: left_pupil
    role: left pupil
  - id: right_pupil
    role: right pupil
  - id: left_brow
    role: left eyebrow
  - id: right_brow
    role: right eyebrow
  - id: tail
    role: expressive secondary-motion limb
  - id: inner_core
    role: ambiguous mouth-covering gesture limb

animation_assets:
  live_runtime:
    manifest: jiajia/animations.yaml
    code_sources:
      - jiajia/actions.py
      - jiajia/pal_motion.py
      - jiajia/rig_pose.py
      - jiajia/prop_shapes.py
  public_gifs:
    readme_demos: docs/media/
    per_action_library: docs/media/actions/
    roast_gallery: docs/media/quotes/
    roast_gallery_en: docs/media/quotes/en/
    demo_generator: scripts/generate_demo_gifs.py
    action_generator: scripts/generate_action_gifs.py
    quote_generator: scripts/generate_quote_gifs.py
    regression_test: tests/test_action_gifs.py
    quote_regression_test: tests/test_quote_gifs.py

costumes:
  britclip:
    path: jiajia/assets/costumes/britclip/
    role: english-mode costume with hat, bow tie, and cane
    status: runtime_asset

third_party_assets:
  notices: jiajia/assets/vendor/THIRD_PARTY_NOTICES.md
  usage: selected icon references and licenses for small flat props
