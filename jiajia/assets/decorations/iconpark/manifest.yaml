schema_version: 1
source:
  name: IconPark
  repository: https://github.com/bytedance/IconPark
  license: Apache-2.0
  commit: 8dc132da4c85671ba6a5962c87aa2bdafbf158e9
  license_file: LICENSE-IconPark.txt
style:
  viewbox: "0 0 48 48"
  stroke: "#3E3038"
  base_fill: "#FFFDFE"
  note: "Small flat accessories for identity/status decoration. Not body art."
groups:
  agent:
    - id: terminal
      file: icons/terminal.svg
      upstream: Terminal
      suggested_use: codex_or_claude_status
    - id: status_monitor
      file: icons/status-monitor.svg
      upstream: Monitor
      suggested_use: agent_screen_watch
    - id: robot
      file: icons/robot.svg
      upstream: Robot
      suggested_use: ai_agent_identity
    - id: code_computer
      file: icons/code-computer.svg
      upstream: CodeComputer
      suggested_use: running_code_or_tests
  hardware:
    - id: cpu
      file: icons/cpu.svg
      upstream: Cpu
      suggested_use: cpu_load
    - id: thermometer
      file: icons/thermometer.svg
      upstream: Thermometer
      suggested_use: temperature
    - id: fan
      file: icons/fan.svg
      upstream: Fan
      suggested_use: cooling_or_fan_noise
    - id: fire
      file: icons/fire.svg
      upstream: Fire
      suggested_use: hot_state
    - id: lightning
      file: icons/lightning.svg
      upstream: Lightning
      suggested_use: power_spike
    - id: battery_charge
      file: icons/battery-charge.svg
      upstream: BatteryCharge
      suggested_use: battery_or_recovery
  task:
