  <title id="title">Britclip / 英伦夹</title>
  <desc id="desc">A flat-vector Paperclip Pal costume with a charcoal top hat, burgundy bow tie, and walnut cane supported by a tapered tail tip.</desc>

  <metadata>
    costume_id: britclip
    lifecycle: persistent_costume
    profession: Edwardian club concierge and old-school gentleman
    source_character: paperclip-pal-refined.svg
    style: pure flat vector, solid fills only, no highlights, no shadows, no mouth, no hands, no feet
    tail_rule: tail remains a tapered tail; it may imitate a supporting gesture but never forms a paw, mitten, fist, or closed hand loop
    render_order: body_root, costume_back, tail_root, costume_front, rig_anchors
  </metadata>

