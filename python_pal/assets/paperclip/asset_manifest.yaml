schema_version: 1

style_rules:
  rendering: pure_flat_vector
  colors:
    body_wire: "#AEAEAE"
    eye_white: "#ECECEC"
    pupil_and_brow: "#402A32"
    bubble: "#FFFFFF"
    optional_shadow: "#E9E9E9"
  constraints:
    - no_mouth
    - no_hands
    - no_feet
    - no_gradients
    - no_texture
    - no_complex_shadow
    - keep_main_silhouette

layers:
  - id: body_wire
    role: main paperclip silhouette
  - id: left_eye_white
    role: left eye white
  - id: right_eye_white
    role: right eye white
  - id: left_pupil
    role: left pupil
  - id: right_pupil
    role: right pupil
  - id: left_brow
    role: left eyebrow
  - id: right_brow
    role: right eyebrow
  - id: optional_flat_shadow
    role: disabled by default

base_character_assets:
  idle_front:
    source: paperclip-pal-refined.svg
    status: current_reference
  idle_3q_left:
    source: procedural_flip_or_skew
    status: planned
  idle_3q_right:
    source: procedural_flip_or_skew
    status: planned
  compact_idle:
    source: scale_idle_front
    status: planned
  sleep_flat:
    source: procedural_flop_shape
    status: planned
  hidden_peek:
    source: crop_or_translate_idle_front
    status: planned
  icon_head:
    source: eyes_brows_upper_body_crop
    status: planned

expression_states:
  innocent:
    eyes: round
    brows: innocent
    body: upright
  suspicious:
    eyes: side_eye
    brows: judge
    body: thinking_tilt
  smug:
    eyes: proud
    brows: proud
    body: smug_sway
  guilty:
    eyes: round
    brows: guilty
    body: snap_upright
  fake_sulk:
    eyes: peek_up
    brows: sulk
    body: sulk
  holding_laugh:
    eyes: proud
    brows: laugh
    body: tiny_shake
  startled:
    eyes: round
    brows: guilty
    body: startled_pop
  sleepy:
    eyes: soft
    brows: soft
    body: sleepy_sag

first_batch_animations:
  idle_breathe:
    type: procedural
    current_implementation: body._animate
    priority: 1
  blink:
    type: procedural
    current_implementation: body._blink
    priority: 1
  side_eye:
    type: procedural
    current_implementation: animation_player eyes=side_eye
    priority: 1
  cold_arrow_then_innocent:
    type: performance_phrase
    current_implementation: animations.yaml
    priority: 1
  fake_sulk:
    type: performance_phrase
    current_implementation: animations.yaml
    priority: 1

identity_turnaround_sheet:
  status: planned
  identities: [default_pal, task_auditor, agent_supervisor, focus_companion, critic_clip, sleepy_clip]
  layout: one front pose plus two micro-expressions per identity
  accessory_strip: [brows, eyes, status_dot, tiny_terminal, z_symbol, red_pen_mark]

first_identity_animation_batch:
  default_pal:
    - animation: idle_breathe
      fallback_action: idle
      fallback_performance: ""
    - animation: cold_arrow_then_innocent
      fallback_action: thinking_tilt
      fallback_performance: cold_arrow_then_innocent
  task_auditor:
    - animation: audit_scan
      fallback_action: scan
      fallback_performance: suspicious_observe
    - animation: soft_nudge
      fallback_action: nod
      fallback_performance: quiet_companion
  agent_supervisor:
    - animation: agent_running
      fallback_action: patrol
      fallback_performance: suspicious_observe
    - animation: agent_error
      fallback_action: shake
      fallback_performance: fake_sulk
  sleepy_clip:
    - animation: sleep_loop
      fallback_action: sleepy_sag
      fallback_performance: fake_sulk
    - animation: wake_startled
      fallback_action: startled_pop
      fallback_performance: smug_but_caught

movement_animation_rules:
  - no_plain_linear_translation
  - every_move_needs_emotional_reason
  - tiny_scoots_can_be_frequent
  - medium_relocation_is_occasional
  - cross_region_travel_is_rare
  - clamp_to_screen_bounds

first_movement_actions:
  twist_scoot:
    tier: tiny
    distance_px: 10-20
    frequency: frequent
    implementation: window_geometry_procedural
    emotion: mischievous_adjustment
  mini_hop_shift:
    tier: tiny
    distance_px: 20-50
    frequency: frequent
    implementation: window_geometry_procedural
    emotion: light_dodge_or_reposition
  relocate_hop:
    tier: medium
    distance_px: 80-150
    frequency: occasional
    implementation: window_geometry_procedural
    emotion: explicit_reposition
  roast_and_scoot:
    tier: personality
    distance_px: 12-18
    frequency: occasional
    implementation: window_geometry_procedural
    emotion: said_it_then_fled
  retreat_to_corner:
    tier: medium
    distance_px: station_based
    frequency: rare
    implementation: window_geometry_procedural
    emotion: quiet_or_self_restraint
  drop_in:
    tier: entrance
    distance_px: 90_vertical
    frequency: rare
    implementation: window_geometry_procedural
    emotion: entrance_or_wake

hardware_status_levels:
  normal:
    body_tint: "#AEAEAE"
    behavior: no_alert
  warm:
    body_tint: "#CAA0A0"
    behavior: subtle_pink_tint
  hot:
    body_tint: "#D86B6B"
    behavior: short_shake_or_fake_sulk
  overloaded:
    body_tint: "#BD4343"
    behavior: deeper_red_plus_flop
  cooling:
    body_tint: "#B8B8B8"
    behavior: one_recovery_line_then_normal

codex_usage_levels:
  normal:
    badge: hidden
    behavior: manual_report_only
  watch:
    badge: small_blue_bar
    behavior: usage_bar_peek
  low:
    badge: small_orange_bar
    behavior: low_usage_warning
  critical:
    badge: small_red_bar
    behavior: critical_usage_panic
  reset_soon:
    badge: small_green_bar
    behavior: reset_clock_watch
  refilled:
    badge: hidden_after_recovery
    behavior: usage_refilled

activity_level_controls:
  quiet:
    speech_frequency: minimal
    animation_frequency: low
    proactive_detection: off
    alert_threshold: critical_only
    allowed_auto_identities: [focus_companion, sleepy_clip]
  normal:
    speech_frequency: important_only
    animation_frequency: normal
    proactive_detection: conservative
    alert_threshold: important_changes
    allowed_auto_identities: [default_pal, agent_supervisor, thermal_technician, usage_accountant]
  active:
    speech_frequency: frequent
    animation_frequency: lively
    proactive_detection: enabled
    alert_threshold: early_warning
    allowed_auto_identities: [task_auditor, critic_clip, bug_coroner, tab_warden]
  hyper:
    speech_frequency: intentionally_chatty
    animation_frequency: very_lively
    proactive_detection: clippy_style_allowed
    alert_threshold: personality_mode
    allowed_auto_identities: [gremlin_clip, task_auditor, critic_clip, tab_warden]

status_badges:
  codex_waiting:
    visual: yellow_circle_C
    trigger: codex_status.waiting_user
  hardware_hot:
    visual: red_circle_degree
    trigger: hardware.hot_or_overloaded
  usage_low:
    visual: orange_circle_percent
    trigger: codex_usage.low_or_critical
  focus_mode:
    visual: slate_circle_F
    trigger: focus_or_quiet_mode
  error:
    visual: red_triangle_exclamation
    trigger: codex_error_or_blocked
  sleeping:
    visual: gray_circle_Z
    trigger: sleepy_or_sulky_mood

event_log:
  path: memory/event_log.jsonl
  privacy_boundary: state_events_only_no_keystrokes_no_clipboard_no_screen_text
  digest_menu: Morning digest

local_chat:
  menu: Talk to 夹夹
  brain: python_pal.chat.PalChatBrain
  session_memory: last_12_turns
  command_router:
    local_before_llm: [codex_status, claude_status, hardware_status, codex_usage, activity_mode, focus_mode, quiet_30m]
  privacy_boundary: status_summaries_only_no_clipboard_no_keystrokes_no_raw_screen_text
  waiting_animation: thinking_tilt_with_thought_dots
  reply_pipeline: Reaction_mood_action_bubble_performance

scripted_demo:
  menu: Scripted demo
  cli: python -m python_pal.main --demo
  events: [codex_running, codex_waiting_user, gpu_98, usage_8, focus_mode, poke_3, cooling_down, codex_done]
