schema_version: 1

reference_source_policy:
  summary: >
    Keep paperclip-pal-refined.svg as the authoritative body silhouette.
    Generated image sets are references for expression cues, prop ideas, and
    identity overlays, not replacements for the live character.
  ranking:
    primary_engineering_reference: gpt_pro_structured_assets
    secondary_expression_reference: gpt_thinking_png_expression_boards
    tertiary_idea_reference: gemini_concept_png_boards
  public_repo_note: >
    Treat generated sheets as personal design references unless their usage
    status is reviewed before publication. Runtime visuals should be redrawn as
    native flat vector code or small project-owned SVG snippets.

reference_sources:
  base_user_svg:
    path: python_pal/assets/paperclip/paperclip-pal-refined.svg
    role: authoritative_character_shape
    use_for:
      - body_wire_silhouette
      - eye_size_and_spacing
      - brow_color_and_weight
      - no_mouth_identity
    status: keep_as_source_of_truth
  gpt_pro_emotions:
    paths:
      sheet_png: python_pal/assets/paperclip/ChatGPT paperclip_pal_36_emotions_assets/paperclip_pal_36_emotions_sheet.png
      preview_png: python_pal/assets/paperclip/ChatGPT paperclip_pal_36_emotions_assets/paperclip_pal_36_emotions_preview.png
      manifest_json: python_pal/assets/paperclip/ChatGPT paperclip_pal_36_emotions_assets/manifest.json
      svg_dir: python_pal/assets/paperclip/ChatGPT paperclip_pal_36_emotions_assets/svg
      png_dir: python_pal/assets/paperclip/ChatGPT paperclip_pal_36_emotions_assets/png
    model_source: ChatGPT Pro
    rank: 1
    best_for:
      - structured_expression_catalog
      - eye_pose_reference
      - brow_pose_reference
      - small_symbol_effects
      - procedural_animation_targets
    avoid_direct_use:
      - mouth_shapes
      - overdecorated_face_marks
      - any expression that weakens no_mouth_identity
    implementation_strategy: translate_to_eye_brow_inner_tail_parameters
  gpt_pro_professions:
    paths:
      overview_png: python_pal/assets/paperclip/ChatGPT paperclip_professions_36_package/paperclip_professions_36_overview.png
      overview_svg: python_pal/assets/paperclip/ChatGPT paperclip_professions_36_package/paperclip_professions_36_overview.svg
      manifest_json: python_pal/assets/paperclip/ChatGPT paperclip_professions_36_package/paperclip_professions_36/manifest.json
      manifest_csv: python_pal/assets/paperclip/ChatGPT paperclip_professions_36_package/paperclip_professions_36/manifest.csv
      svg_dir: python_pal/assets/paperclip/ChatGPT paperclip_professions_36_package/paperclip_professions_36/svg
      png_dir: python_pal/assets/paperclip/ChatGPT paperclip_professions_36_package/paperclip_professions_36/png
    model_source: ChatGPT Pro
    rank: 1
    best_for:
      - identity_overlay_ideas
      - prop_silhouette_reference
      - hats_badges_tools_books_terminal_shapes
      - manifest_driven_asset_selection
    avoid_direct_use:
      - full_outfits_that_cover_body
      - hands_or_arm_like_props
      - complex_costume_layers
      - illustration_style_shadows
    implementation_strategy: redraw_as_small_native_decorations
  gpt_thinking_png_expression_boards:
    paths:
      - python_pal/assets/paperclip/ChatGPT Image Jun 12, 2026, 09_16_14 PM.png
      - python_pal/assets/paperclip/ChatGPT Image Jun 12, 2026, 09_16_34 PM.png
      - python_pal/assets/paperclip/ChatGPT Image Jun 12, 2026, 09_55_42 PM.png
    model_source: ChatGPT thinking
    rank: 2
    best_for:
      - character_attitude_calibration
      - mischievous_brow_language
      - side_eye_and_fake_innocent_reference
      - body_tilt_reference
    avoid_direct_use:
      - runtime_png_import
      - exact_pose_copying
    implementation_strategy: use_as_expression_moodboard_only
  gemini_emotion_board:
    path: python_pal/assets/paperclip/Gemini_Generated_Image_3xblim3xblim3xbl.png
    model_source: Gemini
    rank: 3
    best_for:
      - eyelid_variants
      - softer_emotion_labels
      - alternate_brow_pose_checks
    avoid_direct_use:
      - primary_character_style
      - overly_soft_personality_direction
    implementation_strategy: tertiary_reference_only
  gemini_profession_board:
    path: python_pal/assets/paperclip/Gemini_Generated_Image_1k1t411k1t411k1t.png
    model_source: Gemini
    rank: 3
    best_for:
      - broad_prop_brainstorming
      - occupation_concepts
      - quick_readability_checks_for_props
    avoid_direct_use:
      - human_hand_logic
      - illustration_shading
      - external_tools_that_make_clip_too_complex
      - full_costume_import
    implementation_strategy: idea_pool_only

reference_adoption_rules:
  - preserve_current_body_silhouette
  - preserve_no_mouth_identity
  - preserve_no_hands_no_feet
  - prefer_eye_brow_tail_inner_core_animation_over_extra_face_parts
  - generated_assets_are_reference_not_runtime_default
  - redraw_selected_props_in_project_flat_style
  - use_structured_gpt_pro_manifests_for_selection
  - use_gpt_thinking_pngs_for_attitude_not_assets
  - use_gemini_boards_for_broad_ideas_not_style
  - reject_assets_that_make_the_character_look_like_a_generic_mascot

reference_extraction_shortlist:
  expression_targets_from_gpt_pro:
    - neutral
    - suspicious
    - skeptical
    - guilty
    - proud
    - sleepy
    - bored
    - annoyed
    - confused
    - relieved
  prop_targets_from_gpt_pro_professions:
    agent_supervisor:
      references: [programmer, engineer, reporter]
      extract: [tiny_terminal, small_badge, clipboard_or_status_panel]
    usage_accountant:
      references: [banker, librarian, teacher]
      extract: [ledger, small_book, tiny_bar_chart]
    thermal_technician:
      references: [scientist, firefighter, mechanic]
      extract: [thermometer, heat_mark, warning_tool]
    critic_clip:
      references: [designer, painter, teacher]
      extract: [red_pen, annotation_circle, palette_dot]
    sleepy_clip:
      references: [bored, tired, sleepy]
      extract: [z_mark, droopy_eyelids, soft_brow]
    britclip:
      references: [dry_british_courtesy, old_club_attendant, understated_formality]
      extract: [charcoal_hat, wine_bow_tie, cane, restrained_side_eye]

style_rules:
  rendering: pure_flat_vector
  colors:
    body_wire: "#AEAEAE"
    eye_white: "#ECECEC"
    pupil_and_brow: "#402A32"
    bubble: "#FFFFFF"
    optional_shadow: "#E9E9E9"
  constraints:
    - no_mouth
    - no_hands
    - no_feet
    - no_gradients
    - no_texture
    - no_complex_shadow
    - keep_main_silhouette

layers:
  - id: body_wire
    role: main paperclip silhouette
  - id: left_eye_white
    role: left eye white
  - id: right_eye_white
    role: right eye white
  - id: left_pupil
    role: left pupil
  - id: right_pupil
    role: right pupil
  - id: left_brow
    role: left eyebrow
  - id: right_brow
    role: right eyebrow
  - id: optional_flat_shadow
    role: disabled by default

base_character_assets:
  idle_front:
    source: paperclip-pal-refined.svg
    status: current_reference
  idle_3q_left:
    source: procedural_flip_or_skew
    status: planned
  idle_3q_right:
    source: procedural_flip_or_skew
    status: planned
  compact_idle:
    source: scale_idle_front
    status: planned
  sleep_flat:
    source: procedural_flop_shape
    status: planned
  hidden_peek:
    source: crop_or_translate_idle_front
    status: planned
  icon_head:
    source: eyes_brows_upper_body_crop
    status: planned

expression_states:
  innocent:
    eyes: round
    brows: innocent
    body: upright
  suspicious:
    eyes: side_eye
    brows: judge
    body: thinking_tilt
  smug:
    eyes: proud
    brows: proud
    body: smug_sway
  guilty:
    eyes: round
    brows: guilty
    body: snap_upright
  fake_sulk:
    eyes: peek_up
    brows: sulk
    body: sulk
  holding_laugh:
    eyes: proud
    brows: laugh
    body: tiny_shake
  startled:
    eyes: round
    brows: guilty
    body: startled_pop
  sleepy:
    eyes: soft
    brows: soft
    body: sleepy_sag

first_batch_animations:
  idle_breathe:
    type: procedural
    current_implementation: body._animate
    priority: 1
  blink:
    type: procedural
    current_implementation: body._blink
    priority: 1
  side_eye:
    type: procedural
    current_implementation: animation_player eyes=side_eye
    priority: 1
  cold_arrow_then_innocent:
    type: performance_phrase
    current_implementation: animations.yaml
    priority: 1
  fake_sulk:
    type: performance_phrase
    current_implementation: animations.yaml
    priority: 1

identity_turnaround_sheet:
  status: planned
  identities: [default_pal, task_auditor, agent_supervisor, focus_companion, critic_clip, sleepy_clip]
  layout: one front pose plus two micro-expressions per identity
  accessory_strip: [brows, eyes, status_dot, tiny_terminal, z_symbol, red_pen_mark]

first_identity_animation_batch:
  default_pal:
    - animation: idle_breathe
      fallback_action: idle
      fallback_performance: ""
    - animation: cold_arrow_then_innocent
      fallback_action: thinking_tilt
      fallback_performance: cold_arrow_then_innocent
  task_auditor:
    - animation: audit_scan
      fallback_action: scan
      fallback_performance: suspicious_observe
    - animation: soft_nudge
      fallback_action: nod
      fallback_performance: quiet_companion
  agent_supervisor:
    - animation: agent_running
      fallback_action: patrol
      fallback_performance: suspicious_observe
    - animation: agent_error
      fallback_action: shake
      fallback_performance: fake_sulk
  sleepy_clip:
    - animation: sleep_loop
      fallback_action: sleepy_sag
      fallback_performance: fake_sulk
    - animation: wake_startled
      fallback_action: startled_pop
      fallback_performance: smug_but_caught

movement_animation_rules:
  - no_plain_linear_translation
  - every_move_needs_emotional_reason
  - tiny_scoots_can_be_frequent
  - medium_relocation_is_occasional
  - cross_region_travel_is_rare
  - clamp_to_screen_bounds

first_movement_actions:
  twist_scoot:
    tier: tiny
    distance_px: 10-20
    frequency: frequent
    implementation: window_geometry_procedural
    emotion: mischievous_adjustment
  mini_hop_shift:
    tier: tiny
    distance_px: 20-50
    frequency: frequent
    implementation: window_geometry_procedural
    emotion: light_dodge_or_reposition
  relocate_hop:
    tier: medium
    distance_px: 80-150
    frequency: occasional
    implementation: window_geometry_procedural
    emotion: explicit_reposition
  roast_and_scoot:
    tier: personality
    distance_px: 12-18
    frequency: occasional
    implementation: window_geometry_procedural
    emotion: said_it_then_fled
  retreat_to_corner:
    tier: medium
    distance_px: station_based
    frequency: rare
    implementation: window_geometry_procedural
    emotion: quiet_or_self_restraint
  drop_in:
    tier: entrance
    distance_px: 90_vertical
    frequency: rare
    implementation: window_geometry_procedural
    emotion: entrance_or_wake

hardware_status_levels:
  normal:
    body_tint: "#AEAEAE"
    behavior: no_alert
  busy:
    body_tint: "#AEB6C5"
    behavior: temporary_manual_or_reminder_tint_no_red_alert
  warm:
    body_tint: "#CAA0A0"
    behavior: temporary_subtle_pink_tint_on_reminder
  hot:
    body_tint: "#D86B6B"
    behavior: temporary_red_tint_plus_short_shake_or_fake_sulk
  overloaded:
    body_tint: "#BD4343"
    behavior: temporary_deeper_red_plus_flop
  cooling:
    body_tint: "#B8B8B8"
    behavior: temporary_recovery_line_then_normal

codex_usage_levels:
  normal:
    badge: hidden
    behavior: manual_report_only
  watch:
    badge: small_blue_bar
    behavior: usage_bar_peek
  low:
    badge: small_orange_bar
    behavior: low_usage_warning
  critical:
    badge: small_red_bar
    behavior: critical_usage_panic
  reset_soon:
    badge: small_green_bar
    behavior: reset_clock_watch
  refilled:
    badge: hidden_after_recovery
    behavior: usage_refilled

activity_level_controls:
  quiet:
    speech_frequency: minimal
    animation_frequency: low
    proactive_detection: off
    alert_threshold: critical_only
    allowed_auto_identities: [focus_companion, sleepy_clip]
  normal:
    speech_frequency: important_only
    animation_frequency: normal
    proactive_detection: conservative
    alert_threshold: important_changes
    allowed_auto_identities: [default_pal, agent_supervisor, thermal_technician, usage_accountant]
  active:
    speech_frequency: frequent
    animation_frequency: lively
    proactive_detection: enabled
    alert_threshold: early_warning
    allowed_auto_identities: [task_auditor, critic_clip, bug_coroner, tab_warden]
  hyper:
    speech_frequency: intentionally_chatty
    animation_frequency: very_lively
    proactive_detection: clippy_style_allowed
    alert_threshold: personality_mode
    allowed_auto_identities: [gremlin_clip, task_auditor, critic_clip, tab_warden]

status_badges:
  codex_waiting:
    visual: yellow_circle_C
    trigger: codex_status.waiting_user
  hardware_hot:
    visual: red_circle_degree
    trigger: hardware.hot_or_overloaded
  usage_low:
    visual: orange_circle_percent
    trigger: codex_usage.low_or_critical
  focus_mode:
    visual: slate_circle_F
    trigger: focus_or_quiet_mode
  error:
    visual: red_triangle_exclamation
    trigger: codex_error_or_blocked
  sleeping:
    visual: gray_circle_Z
    trigger: sleepy_or_sulky_mood

event_log:
  path: memory/event_log.jsonl
  privacy_boundary: state_events_only_no_keystrokes_no_clipboard_no_screen_text
  digest_menu: Morning digest

decoration_layer:
  manifest: python_pal/decorations.yaml
  renderer: body.DecorationLayer_flat_canvas_shapes
  style_guide: python_pal/assets/decorations/NATIVE_STYLE.md
  purpose: native_doodle_identity_props_state_marks_and_performance_accents
  constraints: [pure_flat_vector, no_gradients, no_shadows, no_mouth, no_hands, no_feet, round_caps, low_detail]
  imported_icons: semantic_reference_only_not_runtime_final_style
  identity_examples:
    agent_supervisor: [tiny_terminal]
    thermal_technician: [thermometer_icon]
    usage_accountant: [tiny_ledger]
    critic_clip: [red_pen]
  temporary_examples:
    state_mark: [status_dot, heat_puffs, usage_bar, z_symbol, tiny_warning]
    performance_accent: [annotation_circle, stamp]

animation_resolver:
  module: python_pal/animation_resolver.py
  purpose: map_concept_animation_names_to_current_actions_or_performances
  examples:
    audit_scan: scan
    agent_running: patrol
    agent_done_smug: tiny_celebrate
    sleep_loop: sleepy_sag
    boop_escape: roast_and_scoot

idle_variety_scheduler:
  recent_action_memory: 8
  identity_aware: true
  uses_identity_idle_animation: true
  uses_identity_core_animations: true
  quiet_focus_policy: low_stimulus_only
  large_action_cooldown_seconds: 60
  movement_action_cooldown_seconds: 180

local_chat:
  menu: Talk to 夹夹
  brain: python_pal.chat.PalChatBrain
  session_memory: last_12_turns
  command_router:
    local_before_llm: [codex_status, claude_status, hardware_status, codex_usage, activity_mode, focus_mode, quiet_30m]
  privacy_boundary: status_summaries_only_no_clipboard_no_keystrokes_no_raw_screen_text
  waiting_animation: staged_feedback_loop
  waiting_stages: [message_received, context_folded, ollama_waking, model_thinking, reply_waiting, long_wait]
  reply_pipeline: Reaction_mood_action_bubble_performance

scripted_demo:
  menu: Scripted demo
  cli: python -m python_pal.main --demo
  events: [codex_running, codex_waiting_user, gpu_98, usage_8, focus_mode, poke_3, cooling_down, codex_done]
