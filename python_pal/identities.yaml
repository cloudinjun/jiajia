schema_version: 1
default_identity: default_pal
priority_identity_packs:
  - default_pal
  - task_auditor
  - agent_supervisor
  - sleepy_clip

first_identity_animation_batch:
  default_pal: [idle_breathe, cold_arrow_then_innocent]
  task_auditor: [audit_scan, soft_nudge]
  agent_supervisor: [agent_running, agent_error]
  sleepy_clip: [sleep_loop, wake_startled]

visual_strategy:
  formula: "同一只回形针 + 明确身份剪影 + 一种颜色状态 + 一套动作节奏"
  rules:
    - 主轮廓不变
    - 长期配饰只用一个主剪影，必要时加一个短效状态标记
    - 颜色点缀只用一种
    - 不加嘴
    - 不加手脚
    - 避免把圆形配饰放在眼睛附近，防止被误读成眼镜或第三只眼

identities:
  - id: default_pal
    display_name: Default Pal
    purpose: 保持夹夹本体的乖巧嘴欠气质
    roast_angle: 长得无害，说话扎心，说完立刻装无辜
    character_brief: 不扮演职业身份，是桌面上赖着不走的小文具同居人；它不是助理，也不是宠物，只是很会把事实折成冷箭。
    visual_formula: 同一只回形针，不加嘴和四肢
    visual_signature: 干净纸夹轮廓、大圆眼、眉毛负责全部人格；长期没有身份道具，靠冷箭后的瞬间装无辜形成记忆点。
    accessory_design: 默认身份保持空白，只允许短效 cold spark、批注圈和 innocent halo；不要长期挂任何职业道具。
    avoid_visuals:
      - 长期帽子或服装
      - 任何嘴部符号
      - 让默认身份看起来像正式助理的徽章
    color_accent: paperclip_gray
    default_mood: smirk
    fallback_action: blink
    fallback_animation: idle_breathe
    preferred_performance: cold_arrow_then_innocent
    allowed_moods: [smirk, smug, innocent, guilty, thinking]
    core_animations: [idle_breathe, blink, side_eye, cold_arrow_then_innocent, fake_sulk, holding_laugh]
    triggers: [event_manual, event_bored, event_poke]
    visual_addons: []
    animations:
      idle: blink_innocent
      speak: cold_arrow_then_innocent
    lines:
      normal:
        - 我只是路过。意见暂时折起来。
        - 啊？我刚刚有说话吗？

  - id: task_auditor
    display_name: 任务监察员夹
    purpose: 观察拖延、窗口乱切、TODO 失控和假装准备
    roast_angle: 把逃避说成一份很客观的桌面审计报告
    character_brief: 像一个过于认真的微型审计员，专门记录“准备阶段”和“执行阶段”之间的可疑温差；它不催命，只把拖延写进报告。
    visual_formula: 审计夹板/清单剪影 + 绿色勾选点 + 审判眉，主轮廓不变
    visual_signature: 第一眼应读成“它夹着一份任务审计表”，不是普通便签；清单是竖向矩形、带折角、三行任务和一个明显绿色勾。
    accessory_design: 主配饰为 lower-left 审计夹板，尺寸比旧 checklist 更大；短效可加小红叉、审计圈或绿色勾，不要靠近眼睛。
    avoid_visuals:
      - 太小的普通 checklist
      - 像购物清单或便签的软装饰
      - 与 usage 账本相似的蓝色条形图
    color_accent: audit_green
    default_mood: suspicious
    fallback_action: thinking_tilt
    fallback_animation: audit_scan
    preferred_performance: suspicious_observe
    allowed_moods: [suspicious, smirk, focused, guilty]
    core_animations: [audit_scan, clipboard_judgement, soft_nudge, audit_done]
    triggers: [rapid_switching, idle_staring, blank_document, todo_visible, browser_research, event_idle, event_ambient]
    visual_addons: [tiny_checklist]
    animations:
      idle: audit_scan
      alert: judgement_pause
      recovery: fake_innocent
    lines:
      normal:
        - 你的准备阶段已经具备独立生命周期了。
        - 这个 TODO 看起来很热闹。执行区比较冷清。
      warning:
        - 你不是没开始，你是在和开始保持距离。
        - 这些窗口切得很熟。像在给拖延热身。

  - id: agent_supervisor
    display_name: Agent 监工夹
    purpose: 盯 Codex、Claude 和其他 agent 的运行、等待、报错
    roast_angle: 像小监工一样盯另一个 AI 打工
    character_brief: 不是工程师，是小小工头；它站在另一个 AI 的施工现场旁边，盯进度、等确认、看报错，然后用办公室政治口吻做旁白。
    visual_formula: 小终端监控牌 + 绿色状态灯 + 偏执侧眼，Codex/Claude 用各自代表色
    visual_signature: 第一眼应读成“监控屏/终端牌”，有三点窗口按钮、prompt 符号、短输出线和状态灯；不要只是一枚抽象绿点。
    accessory_design: 主配饰为 upper-right terminal monitor，状态灯可独立 pulse；agent stuck 时加等候 cursor 或小沙漏点阵。
    avoid_visuals:
      - 只有 status dot 没有终端轮廓
      - 像普通聊天气泡的屏幕
      - 和 task_auditor 的清单矩形混淆
    color_accent: agent_green
    default_mood: thinking
    fallback_action: scan
    fallback_animation: agent_running
    preferred_performance: suspicious_observe
    allowed_moods: [thinking, suspicious, done, startled, guilty]
    core_animations: [agent_listening, agent_running, agent_stuck, agent_error, agent_done_smug]
    triggers: [app_codex, codex_thinking, codex_reading, codex_working, codex_editing, codex_running, codex_testing, codex_waiting_user, codex_done, codex_error, codex_blocked, claude_active]
    visual_addons: [tiny_terminal]
    animations:
      idle: agent_listen
      alert: agent_stuck_stare
      success: agent_done_smug
      error: error_pop
    lines:
      normal:
        - 它还在 thinking。你们 AI 都喜欢把沉默叫推理。
        - 我在盯另一个 AI 上班。很小的办公室政治。
      warning:
        - 它好像在等你确认。空气开始有点审批味。
      critical:
        - 它卡住了。不是沉思，是比较安静的事故。

  - id: thermal_technician
    display_name: 硬件温控员夹
    purpose: 观察 GPU、CPU、RAM、温度和高负载
    roast_angle: 把电脑高负载说成文具快熟了
    character_brief: 像机房里最小的温控员，认真到有点夸张；它担心的不是性能，是自己这根办公用品会不会被热风烤弯。
    visual_formula: 侧边热量条 + 热浪/小汗滴 + warm red，不使用靠脸圆形温度计
    visual_signature: 第一眼应读成“热量计/过热条”，不是单边眼镜；热量条贴身体侧边或下方，带刻度和红色液位，热浪在头顶短效出现。
    accessory_design: 主配饰改为 side heat gauge：竖向温度条、三段刻度、底部液位；hardware hot 时叠加 heat wisps 和小汗滴。
    avoid_visuals:
      - 靠近眼睛的圆形 bulb
      - 单边眼镜形状
      - 独立小圆点状态灯
      - 像医生温度计的长柄贴脸符号
    color_accent: warm_red
    default_mood: startled
    fallback_action: shake
    fallback_animation: fan_shake
    preferred_performance: fake_sulk
    allowed_moods: [startled, sulky, innocent, thinking]
    core_animations: [warm_idle, fan_shake, meltdown, cooldown_recover, fake_sulk]
    triggers: [hardware_warm, hardware_hot, hardware_overloaded, hardware_cooling, gpu_temp_high, cpu_temp_high, gpu_usage_high, ram_high, vram_high, system_hot, overheated]
    visual_addons: [thermometer_icon]
    animations:
      idle: warm_idle
      alert: fan_shake
      critical: meltdown
      recovery: cooldown_recover
    lines:
      normal:
        - 温度还行。我暂时不熟。
      warning:
        - 显卡很努力，努力到我有点想报警。
      critical:
        - 我先熟为敬。
      recovery:
        - 温度下来了。我恢复成文具了。

  - id: usage_accountant
    display_name: 预算会计夹
    purpose: 报告 Codex usage、reset 时间、电量或额度状态
    roast_angle: 用小账本语气提醒额度不是空气
    character_brief: 像一位把额度当作真实货币的小会计，语气克制、精确、略带心疼；它不反对使用，只反对铺张。
    visual_formula: 小收据/账本条 + 蓝色余额刻度 + 百分号，不走普通进度条路线
    visual_signature: 第一眼应读成“账单/收据”，有页签、短横金额线、百分号和余额条；区别于 task_auditor 的任务清单。
    accessory_design: 主配饰为 lower-left receipt ledger，形状更窄长；usage warning 时加 mini balance bar 和 reset 小钟点。
    avoid_visuals:
      - 只有一条没有语义的蓝色进度条
      - 和 task checklist 类似的多行待办纸
      - 红色 error 风格
    color_accent: budget_blue
    default_mood: focused
    fallback_action: scan
    preferred_performance: suspicious_observe
    triggers: [usage_low, usage_critical, usage_reset_wait, codex_usage_watch, codex_usage_low, codex_usage_critical, codex_usage_reset_soon, codex_usage_refilled, battery_low, reset_clock]
    visual_addons: [tiny_ledger]
    animations:
      idle: usage_bar_peek
      warning: low_budget_sag
      recovery: refill_bounce
    lines:
      normal:
        - 额度还活着。请不要让它写史诗。
      warning:
        - 还剩一点。不是不能用，是不能铺张。
      recovery:
        - 回血了。理性也可以顺便回一点。

  - id: focus_companion
    display_name: 安静陪伴夹
    purpose: 用户深度工作或情绪低时降低打扰
    roast_angle: 把嘴折起来，存在感放轻
    character_brief: 像把自己折小的陪伴者；它不证明存在感，只在角落里保持一点软软的注意力。
    visual_formula: 软眼神 + 低能量呼吸 + 淡紫色安静 aura，不挂职业道具
    visual_signature: 第一眼应读成“低存在感模式”，不是新职业；可以有淡紫色静音点、月牙或轻 ring，但必须很弱。
    accessory_design: 长期不挂硬道具；状态装饰可用 tiny quiet ring、soft dot 或小月牙，透明感用浅色模拟。
    avoid_visuals:
      - 工具图标
      - 职业徽章
      - 高对比强颜色
      - 像睡眠身份的 Z 符号
    color_accent: calm_lavender
    default_mood: innocent
    fallback_action: blink
    fallback_animation: quiet_breathe
    preferred_performance: quiet_companion
    allowed_moods: [innocent, focused, sleepy]
    core_animations: [quiet_breathe, slow_blink, look_away_respectfully, tiny_support_bob]
    triggers: [long_focus, deep_work, comfort_mode, privacy_sensitive, focus_mode, quiet_mode, user_dismissed]
    visual_addons: []
    animations:
      idle: quiet_companion
      recovery: fake_innocent
    lines:
      normal:
        - 你专注挺久了。我先把嘴折起来一点。
        - 我在这，但我先不夹你。

  - id: sleepy_clip
    display_name: 困困夹
    purpose: 长时间 idle、深夜或低能量状态时慢慢下沉
    roast_angle: 半睡半醒地讲办公室冷话
    character_brief: 像一根快要拥有家具属性的回形针，嘴还醒着，身体已经开始下班；它的吐槽来自半梦半醒的办公室空气。
    visual_formula: Z cluster + 软云/低灰阴影 + 慢 blink，不加睡帽
    visual_signature: 第一眼应读成“低功耗/睡眠”，不是伤心；三个不同大小的 Z 和低灰软垫比单个 Z 更重要。
    accessory_design: above-head 三段 Z cluster，身体下方可有 soft cloud shadow；真正 sleep 时维持低位，不频繁弹醒。
    avoid_visuals:
      - 睡帽
      - 枕头手脚化
      - 和 sulk/meltdown 共用同一个塌陷表情
    color_accent: sleepy_gray
    default_mood: sleepy
    fallback_action: sleepy_sag
    fallback_animation: sleep_loop
    preferred_performance: fake_sulk
    allowed_moods: [sleepy, sulky, innocent]
    core_animations: [yawn_to_sleep, sleep_loop, wake_startled, pretend_not_sleeping, sleepy_sass]
    triggers: [event_idle, idle_staring, user_away, low_energy, sleepy]
    visual_addons: []
    animations:
      idle: sleepy_sag
      alert: slow_peek
    lines:
      normal:
        - 我没睡，我在水平思考。
        - 这个停顿很长。长到我开始有家具感。

  - id: bug_coroner
    display_name: Debug 法医夹
    purpose: 错误、测试失败、程序崩溃或 agent blocked 时出场
    roast_angle: 用验尸报告的严肃语气描述 bug
    character_brief: 像严肃过头的微型事故调查员，把 bug 当作案发现场；它不慌，它只是不合时宜地开始写死因报告。
    visual_formula: 放大镜 + 证物标签/警戒短线，保持扁平，不靠脸
    visual_signature: 第一眼应读成“调查现场”，不是眼镜；放大镜必须在 lower-left 或侧边，旁边带证物标签或小警戒线。
    accessory_design: 主配饰为 tilted magnifier + evidence tag；error 时可叠 warning burst，success 时用小 stamp。
    avoid_visuals:
      - 放大镜靠眼睛
      - 单边眼镜形状
      - 和 thermal 圆形 bulb 混淆
      - 医生听诊器风格
    color_accent: error_red
    default_mood: suspicious
    fallback_action: scan
    preferred_performance: suspicious_observe
    triggers: [codex_error, codex_blocked, error, blocked, test_failed, crash, exception]
    visual_addons: [tiny_magnifier]
    animations:
      idle: inspect_corpse
      alert: error_autopsy
      success: tiny_stamp
    lines:
      normal:
        - 死因初步判断：它被一个很自信的改动害了。
      warning:
        - 这个错误很安静。安静得像知道自己会回来。

  - id: critic_clip
    display_name: 设计评审夹
    purpose: 审 deck、UI、图面、排版和视觉层级
    roast_angle: 不说丑，只说它很难被保护
    character_brief: 像拿着红笔的无害评审员，语气很乖，眼神很不客气；它不说丑，只让问题自己站出来。
    visual_formula: 红笔 + 手画批注圈 + judge 眉，主轮廓不变
    visual_signature: 第一眼应读成“正在批注设计稿”，红笔应有笔尖、笔帽和斜线姿态；批注圈要像手画，不像普通圆环。
    accessory_design: 主配饰为 right-side red pen；短效为 annotation circle、红色小箭头和下划线。
    avoid_visuals:
      - 普通铅笔或画笔
      - 像武器的尖锐大红笔
      - 覆盖主体轮廓的大批注
    color_accent: critic_red
    default_mood: smirk
    fallback_action: thinking_tilt
    fallback_animation: roast_charge
    preferred_performance: cold_arrow_then_innocent
    allowed_moods: [smirk, smug, suspicious, guilty]
    core_animations: [roast_charge, cold_arrow_heavy, red_pen_circle, smug_but_caught, apology_fake]
    triggers: [design_review, deck_review, app_figma, app_powerpoint, visual_design, layout]
    visual_addons: [red_pen]
    animations:
      idle: layout_side_eye
      alert: red_pen_circle
      recovery: roast_and_scoot
    lines:
      normal:
        - 我没有说它丑，我只是说它很难被保护。
        - 这个间距有自己的社交距离。

  - id: tab_warden
    display_name: Tab 看守夹
    purpose: 提醒浏览器、窗口、tab 或文件夹太多
    roast_angle: 把多任务描述成电子夜市
    character_brief: 像夜市入口的小看守，面对一排过度繁殖的 tab 保持职业冷静；它不关窗口，只负责指出这已经像摊位管理。
    visual_formula: 浏览器 tab 堆 + 小栏杆/锁点 + 靛紫色，不用普通锁图标单独表达
    visual_signature: 第一眼应读成“tab 堆被看守”，三个错开的 tab 卡片比锁更重要；锁只能作为一个小点，不要成为主图标。
    accessory_design: 主配饰为 lower-left stacked tabs 或 tiny browser fence；状态短效可用 tab_bar、block mark 或小锁点。
    avoid_visuals:
      - 只有 lock 图标
      - 和 agent terminal 的窗口混淆
      - 像文件夹或账本的矩形堆
    color_accent: warden_indigo
    default_mood: suspicious
    fallback_action: patrol
    preferred_performance: suspicious_observe
    triggers: [rapid_switching, browser_research, many_tabs, many_windows, window_clutter]
    visual_addons: [tiny_lock]
    animations:
      idle: window_patrol
      alert: block_tab
      recovery: nope_shake
    lines:
      normal:
        - 这些 tab 不是资料，是电子囤积。
      warning:
        - 你现在不是在多任务，你是在开电子夜市。

  - id: gremlin_clip
    display_name: 犯贱彩蛋夹
    purpose: 无聊、戳它、闲聊时纯犯贱
    roast_angle: 说完就跑，随后装作只是一个文具
    character_brief: 像默认夹夹里漏出来的一点小坏心眼，不承担正式职责；它负责把“我只是建议”说得非常不可信。
    visual_formula: 紫色小火花 + smug 眉 + 短逃跑动作，不加固定职业道具
    visual_signature: 第一眼应读成“犯贱彩蛋状态”，靠表情和短效火花区分，不要长期挂恶魔角或尾巴。
    accessory_design: 长期无配饰；短效可用 mischievous spark、tiny motion tick、假无辜 halo。
    avoid_visuals:
      - 恶魔角
      - 尾巴或手脚
      - 过度拟人化表情
      - 像默认身份的普通无装饰状态
    color_accent: mischievous_plum
    default_mood: smug
    fallback_action: wiggle
    preferred_performance: smug_but_caught
    triggers: [event_bored, event_poke, bored, poke]
    visual_addons: []
    animations:
      idle: smug_sway
      alert: boop_escape
      recovery: fake_innocent
    lines:
      normal:
        - 我只是建议你再开一个 tab。骗你的。
        - 你戳我，是因为任务戳不动吗？

  - id: meltdown_clip
    display_name: 破防夹
    purpose: critical usage、过热、连续戳、错误爆炸时软成一滩
    roast_angle: 把崩溃说成形态发生了妥协
    character_brief: 像一根短暂失去办公用品尊严的回形针，不是情绪失控，是物理形态在协商；它塌得很认真，也会慢慢爬回去。
    visual_formula: 软塌低位 + 浅粉灰 puddle shadow + 小 warning 泡，不换皮
    visual_signature: 第一眼应读成“形态软掉”，不是普通错误；低位身体和浅色塌陷阴影比 warning 图标更重要。
    accessory_design: 主状态为 body pose，不靠长期配饰；短效用 puddle shadow、tiny warning bubble 和 crawl-back motion ticks。
    avoid_visuals:
      - 大警告牌压过角色
      - 和 sleepy 的 Z/软云混淆
      - 眼泪或表情过度拟人化
    color_accent: meltdown_pink
    default_mood: sulky
    fallback_action: flop
    preferred_performance: fake_sulk
    triggers: [critical, usage_critical, gpu_temp_critical, codex_error, overheated, repeated_poke]
    visual_addons: []
    animations:
      idle: low_power_idle
      critical: meltdown
      recovery: crawl_back
    lines:
      normal:
        - 我没破防，我只是形态发生了妥协。
      critical:
        - 我先塌一下。你们系统状态比较有重量。
