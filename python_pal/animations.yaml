schema_version: 1

first_batch:
  - idle_breathe
  - blink
  - side_eye
  - typing_focus
  - thinking_loop
  - error_shake
  - sleep_loop
  - cold_arrow_then_innocent
  - fake_sulk

procedural_assets:
  idle_breathe:
    implementation: body._animate
    layers: [body_wire]
    note: continuous low-amplitude bob; no separate frame asset
  blink:
    implementation: body._blink
    layers: [left_pupil, right_pupil]
    note: squash pupils vertically, then restore
  side_eye:
    implementation: animation_player eyes=side_eye
    layers: [left_pupil, right_pupil]
    note: pupil offset used inside performance phrases

logical_states:
  idle:
    aliases: [standby, neutral, quiet]
    performance: ""
    fallback_action: idle
    meaning: quiet standby; only the breathing loop should be continuous
  typing:
    aliases: [input, listening, composing, user_typing]
    performance: typing_focus
    fallback_action: blink
    meaning: user is entering a prompt or the pal is listening without interrupting
  thinking:
    aliases: [think, waiting, loading, processing, working, running]
    performance: thinking_loop
    fallback_action: thinking_tilt
    meaning: model, agent, or status check is active
  success:
    aliases: [done, finished, complete, completed, celebrate, refilled, recovery]
    performance: tiny_celebrate
    fallback_action: happy_bounce
    meaning: task completed, quota recovered, or status improved
  error:
    aliases: [blocked, failed, failure, crash, exception, critical, overloaded]
    performance: error_shake
    fallback_action: shake
    meaning: error, blocked flow, failed check, or critical status
  sleep:
    aliases: [sleeping, asleep, sleepy, sulky, sulk, low_power]
    performance: sleep_loop
    fallback_action: sleepy_sag
    meaning: low energy, quiet mode, or dramatic collapse
  suspicious:
    aliases: [audit, judging, observe]
    performance: suspicious_observe
    fallback_action: thinking_tilt
    meaning: noticed avoidance or odd context
  cold_arrow:
    aliases: [roast, smirk, smug]
    performance: cold_arrow_then_innocent
    fallback_action: thinking_tilt
    meaning: soft roast followed by fake innocence
  guilty:
    aliases: [caught]
    performance: smug_but_caught
    fallback_action: blink
    meaning: caught after being smug
  comfort:
    aliases: [focused, innocent, calm]
    performance: quiet_companion
    fallback_action: blink
    meaning: low-pressure companionship
  waking:
    aliases: [wake, recovering]
    performance: wake_startled
    fallback_action: startled_pop
    meaning: returning from sleep or quiet mode
  poke:
    aliases: [boop, touched]
    performance: smug_but_caught
    fallback_action: wiggle
    meaning: touch reaction

state_rules:
  - state: success
    moods: [happy, proud, done, success]
    actions: [happy_bounce, celebrate]
  - state: error
    moods: [error, blocked, failed, failure, critical, overloaded, startled]
    actions: [shake, startled_pop]
  - state: sleep
    moods: [sleepy, sulky, sulk]
    actions: [sleepy_sag, sulk, hide, flop]
  - state: typing
    moods: [typing, listening, input, composing]
    bubble_shapes: [thought]
  - state: thinking
    moods: [thinking, processing, waiting, loading]
    actions: [thinking_tilt, scan, patrol]
    bubble_shapes: [thought]
  - state: comfort
    moods: [focused, innocent]
  - state: suspicious
    moods: [suspicious]
    actions: [scan, peek, patrol]
  - state: guilty
    moods: [guilty]
  - state: cold_arrow
    moods: [smirk, smug]
    bubble_shapes: [speech]

performance_phrases:
  typing_focus:
    type: procedural
    fallback_action: blink
    locks_cursor_follow: true
    sequence:
      - brows: innocent
        eyes: round
        duration_ms: 120
      - action: blink
        duration_ms: 160
      - eyes: side_eye
        duration_ms: 220
      - action: nod
        duration_ms: 260
      - bubble: speak
        duration_ms: 120
      - reset: expression

  thinking_loop:
    type: procedural
    fallback_action: thinking_tilt
    locks_cursor_follow: true
    sequence:
      - brows: soft
        eyes: neutral
        duration_ms: 120
      - action: thinking_tilt
        duration_ms: 520
      - eyes: side_eye
        duration_ms: 180
      - action: scan
        duration_ms: 620
      - bubble: speak
        duration_ms: 120
      - action: nod
        duration_ms: 220
      - reset: expression

  error_shake:
    type: procedural
    fallback_action: shake
    locks_cursor_follow: true
    sequence:
      - brows: guilty
        eyes: round
        duration_ms: 120
      - action: shake
        duration_ms: 360
      - bubble: speak
        duration_ms: 130
      - brows: sulk
        eyes: peek_up
        duration_ms: 220
      - action: blink
        duration_ms: 160
      - reset: expression

  cold_arrow_then_innocent:
