[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jiajia"
version = "0.1.0"
description = "A lightweight Windows desktop paperclip pet with local personality, animation, and low-privacy status monitors."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "cloudinjun" }
]
dependencies = []

[project.optional-dependencies]
media = [
  "Pillow>=10.0",
]
monitoring = [
  "psutil>=5.9",
]
all = [
  "Pillow>=10.0",
  "psutil>=5.9",
]

[tool.setuptools]
packages = ["jiajia"]
include-package-data = true

[tool.setuptools.package-data]
jiajia = [
  "*.yaml",
  "locales/*.yaml",
  "assets/**/*.yaml",
  "assets/**/*.md",
  "assets/**/*.svg",
  "assets/vendor/**/LICENSE",
]

[tool.jiajia]
runtime_dependencies = []
runtime_note = "The desktop pet runtime uses the Python standard library and Tkinter; optional extras support GIF generation and hardware metrics."
