name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Python tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[media]"

      - name: Action GIF signature test
        run: python -m unittest discover -s tests -p test_action_gifs.py

      - name: Chat language test
        run: python -m unittest discover -s tests -p test_chat_language.py

      - name: Quiz engine test
        run: python -m unittest discover -s tests -p test_quiz_engine.py

      - name: Quiz safety test
        run: python -m unittest discover -s tests -p test_quiz_safety.py
